<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f6faf4">
<meta name="description" content="Personal meal-prep grocery list with pantry, packages and store aisles. Works offline.">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Prep List">
<title>Prep List</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="css/app.css">
<script>
  // Apply saved theme before first paint (avoids a flash of the wrong theme).
  try { var t = localStorage.getItem('preplist.theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch (e) {}
</script>
</head>
<body>
<header class="topbar" id="topbar">
  <h1 id="title">Prep List</h1>
  <div id="topActions" class="row" style="gap:0"></div>
</header>
<main id="main"><noscript>Prep List needs JavaScript enabled.</noscript></main>
<div id="fab"></div>
<nav class="navbar" id="nav" aria-label="Main"></nav>
<div id="sheets"></div>
<div class="snack" id="snack" role="status" aria-live="polite"></div>
<script src="js/core.js"></script>
<script src="js/data.js"></script>
<script src="js/store.js"></script>
<script src="js/app.js"></script>
</body>
</html>
